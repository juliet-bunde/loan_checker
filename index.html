<!DOCTYPE html>
<html>
    <head>
        <title>Loan Eligibility Checker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container1">
            <h1>Loan Eligibility Checker</h1>
            <form>
                <label for="age">Age:</label><br>
                <input type="number" id="age" placeholder="Enter your Age"><br><br>
                <label for="monthlyincome">Monthly Income (KES):</label><br>
                <input type="number" id="monthlyincome" placeholder="Enter your income"><br><br>
                <label for="employmentTypes">Employment Type:</label><br>
                <select id="employmentTypes">
                    <option value="Employed">Employed</option>
                    <option value="Self-employed">Self- employed</option>
                    <option value="Student">Student</option>
                </select><br><br>
                <label for="creditscore">Credit Score (0-100):</label><br>
                <input type="number" id="creditscore" placeholder="Enter your credit score"><br><br>
                <button id="checkEligibility" onclick="checkEligibility()">Check Eligibility</button><br><br>
                <div class="container2" id="Result">Result</div>
            </form>
        </div>
        <script src="script.js"></script>
    </body>
</html>
