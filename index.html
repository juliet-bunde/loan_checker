<!DOCTYPE html>
<html>
    <head>
        <title>Loan Eligibility Checker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>
            <h1>Loan Checker</h1>
            <form>
                <label for="age">Age</label><br><br>
                <input type="number" id="age"  placeholder="Enter your age"><br><br>
                <label>Monthly Income:</label><br><br>
                <input type="number" id="income" placeholder="Enter your monthly income"><br><br>
                <label>Employment Type:</label><br><br>
                <select id="employmentType" placeholder="Select">
                    <option>Employed</option>
                    <option>Self-Employed</option>
                    <option>Student</option>
                </select><br><br>
                <label for="creditScore">Credit Score (0-100)</label><br><br>
                <input type="number" id="creditScore" placeholder="Enter your Credit Score"><br><br>
                <button>Check Eligibility</button>
            </form>
        </div>
        <script src="script.js"></script>
    </body>
</html>
